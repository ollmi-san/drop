<path d="M144 154 Q154 170 152 196" stroke="rgba(255,255,255,0.08)" stroke-width="3.5" fill="none"/>
<!-- Rücken gerade -->
<path d="M87 162 Q86 206 87 260" stroke="rgba(255,255,255,0.05)" stroke-width="2.5" fill="none"/>
<!-- Bauch flach -->
<path d="M147 238 Q146 258 140 272" stroke="rgba(255,255,255,0.05)" stroke-width="2" fill="none"/>

<!-- Vorderer Arm -->
<path d="M136 150 Q148 158 153 182 L158 264 Q160 278 150 280 L140 282 L134 196 Q132 166 132 147 Z"
      fill="url(#figD)"/>
<ellipse cx="155" cy="284" rx="11" ry="8" fill="url(#sk)" transform="rotate(10,155,284)"/>

<!-- Schulter (breit) -->
<ellipse cx="134" cy="146" rx="15" ry="11" fill="url(#fig)"/>

<!-- Hals -->
<path d="M113 116 Q110 128 110 140 L120 145 L130 140 Q130 128 128 116 Z" fill="url(#sk)"/>

<!-- Kopf Seitenprofil (männlicher Kiefer) -->
<path d="M98 74 Q96 52 113 40 Q122 34 130 38 Q146 47 148 74
         Q146 99 138 111 Q130 119 120 119 Q109 119 103 111 Q97 98 98 74 Z" fill="url(#sk)"/>
