<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 620" fill="none">
<defs>
  <linearGradient id="fig" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#50526a"/>
    <stop offset="60%"  stop-color="#3c3e56"/>
    <stop offset="100%" stop-color="#282938"/>
  </linearGradient>
  <linearGradient id="figD" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#282938"/>
    <stop offset="100%" stop-color="#3e4058"/>
  </linearGradient>
  <linearGradient id="sk" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#c09070"/>
    <stop offset="100%" stop-color="#a07250"/>
  </linearGradient>
  <linearGradient id="hr" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#1e1614"/>
    <stop offset="100%" stop-color="#0f0c0a"/>
  </linearGradient>
  <filter id="gs"><feGaussianBlur stdDeviation="0.6"/></filter>
</defs>

<ellipse cx="126" cy="615" rx="54" ry="7" fill="rgba(70,55,180,0.20)" filter="url(#gs)"/>

<!-- Schuh Seitenprofil (chunkier) -->
<path d="M90 570 L84 598 Q82 608 98 610 L134 610 Q146 607 143 596 L138 573 Z" fill="#1a1b24"/>
<path d="M84 597 L143 597" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
<rect x="84" y="595" width="24" height="7" rx="3" fill="#111118"/>

<!-- Unterschenkel -->
<path d="M100 452 L94 573 Q93 581 102 583 L124 583 Q133 581 131 571 L127 452 Z" fill="url(#fig)"/>
<!-- Wade -->
<path d="M128 475 Q138 500 134 542" stroke="rgba(255,255,255,0.06)" stroke-width="3" fill="none"/>

<!-- Oberschenkel -->
<path d="M102 302 L98 454 Q97 462 104 465 L124 465 Q133 462 131 453 L128 302 Z" fill="url(#fig)"/>

<!-- Hüfte -->
<path d="M98 266 Q93 284 95 304 L102 312 L132 312 L140 300 Q138 280 133 266
         Q126 254 116 253 Q107 254 98 266 Z" fill="url(#fig)"/>
<!-- Gesäß -->
<path d="M95 272 Q88 294 92 315" stroke="rgba(255,255,255,0.05)" stroke-width="4" fill="none"/>

<!-- Torso Seitenprofil (athletisch: breite Brust, gerade Rücken) -->
