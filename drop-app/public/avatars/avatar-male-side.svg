<path d="M98 90 Q96 112 120 119 Q108 115 102 106 Q98 100 98 90 Z" fill="url(#sk)"/>
<!-- Nase (größer, männlich) -->
<path d="M148 76 L156 89 L149 93" stroke="url(#sk)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-opacity="0.6"/>
<!-- Mund -->
<path d="M143 107 Q148 110 152 107" stroke="#7a4a38" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<!-- Kinnbart-Schatten -->
<path d="M136 113 Q144 118 150 114 Q146 120 140 121 Q135 120 136 113 Z" fill="rgba(20,14,12,0.2)"/>
<!-- Auge -->
<ellipse cx="135" cy="72" rx="5.5" ry="4.5" fill="rgba(20,14,12,0.88)"/>
<ellipse cx="136.5" cy="70" rx="1.4" ry="1.2" fill="rgba(255,255,255,0.6)"/>
<!-- Braue (dick) -->
<path d="M127 65 Q134 62 142 64" stroke="rgba(20,14,12,0.85)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
<!-- Ohr -->
<ellipse cx="99" cy="82" rx="5.5" ry="8" fill="url(#sk)"/>
<path d="M100 77 Q103 82 100 88" stroke="rgba(160,114,80,0.4)" stroke-width="1" fill="none"/>

<!-- Haar kurz Seite -->
<path d="M98 72 Q96 50 113 38 Q122 32 130 36 Q146 45 148 72
         Q143 52 132 44 Q122 38 112 42 Q99 52 98 72 Z" fill="url(#hr)"/>
<!-- Seiten kurz -->
<path d="M98 72 Q96 60 98 50" stroke="url(#hr)" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- Textur -->
<path d="M101 55 Q115 48 130 50 Q142 48 149 56" stroke="rgba(10,8,6,0.4)" stroke-width="1.8" fill="none"/>
</svg>
