<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 620" fill="none">
<defs>
  <linearGradient id="fig" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%"   stop-color="#50526a"/>
    <stop offset="55%"  stop-color="#3c3e56"/>
    <stop offset="100%" stop-color="#282938"/>
  </linearGradient>
  <linearGradient id="rim" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%"   stop-color="#7880b0" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>
  <linearGradient id="sk" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#c09070"/>
    <stop offset="100%" stop-color="#a07250"/>
  </linearGradient>
  <linearGradient id="hr" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#1e1614"/>
    <stop offset="100%" stop-color="#0f0c0a"/>
  </linearGradient>
  <filter id="gs"><feGaussianBlur stdDeviation="0.6"/></filter>
</defs>

<ellipse cx="130" cy="615" rx="62" ry="8" fill="rgba(70,55,180,0.20)" filter="url(#gs)"/>

<!-- Schuhe (breiter, chunkier) -->
<path d="M84 570 L79 596 Q77 606 91 608 L113 608 Q123 605 121 595 L118 572 Z" fill="#1a1b24"/>
