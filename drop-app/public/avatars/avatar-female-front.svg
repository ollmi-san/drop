<path d="M108 98 Q108 116 130 120 Q152 116 152 98" fill="url(#sk)"/>

<!-- ═══ HAAR ════════════════════════════════════════════════════════════════ -->
<!-- Hochgesteckt: deckt Stirn und Seiten, Bun oben -->
<path d="
  M100 74
  Q98  50 114 38
  Q122 32 130 32
  Q138 32 146 38
  Q162 50 160 74
  Q157 54 146 44
  Q138 38 130 38
  Q122 38 114 44
  Q103 54 100 74 Z
" fill="url(#hr)"/>
