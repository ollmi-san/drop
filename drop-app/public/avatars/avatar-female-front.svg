<path d="M160 74 Q162 62 160 50" stroke="url(#hr)" stroke-width="6" stroke-linecap="round" fill="none"/>
<!-- Bun -->
<ellipse cx="130" cy="30" rx="16" ry="11" fill="url(#hr)"/>
<ellipse cx="130" cy="26" rx="9"  ry="7"  fill="rgba(10,8,6,0.7)"/>
<!-- Haar-Wrap Linie -->
<path d="M114 38 Q130 34 146 38" stroke="rgba(10,8,6,0.35)" stroke-width="1.5" fill="none"/>

<!-- ═══ GESICHT ══════════════════════════════════════════════════════════════ -->
<!-- Augen -->
<ellipse cx="117" cy="76" rx="5.5" ry="4.5" fill="rgba(20,14,12,0.88)"/>
<ellipse cx="143" cy="76" rx="5.5" ry="4.5" fill="rgba(20,14,12,0.88)"/>
<!-- Glanz -->
<ellipse cx="118.5" cy="74.2" rx="1.5" ry="1.2" fill="rgba(255,255,255,0.65)"/>
<ellipse cx="144.5" cy="74.2" rx="1.5" ry="1.2" fill="rgba(255,255,255,0.65)"/>
<!-- Brauen -->
<path d="M110 68 Q117 65 124 67" stroke="rgba(20,14,12,0.8)" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M136 67 Q143 65 150 68" stroke="rgba(20,14,12,0.8)" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- Nase -->
<path d="M130 82 Q127 90 125 93 Q130 95 135 93 Q133 90 130 82 Z" fill="rgba(0,0,0,0.1)"/>
<!-- Lippen -->
<path d="M122 105 Q130 109 138 105" stroke="#8a5045" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<path d="M123 105 Q130 102 137 105" stroke="#c07060" stroke-width="0.8" fill="none" stroke-opacity="0.5"/>

<!-- ═══ SCHLÜSSELBEIN ════════════════════════════════════════════════════════ -->
<path d="M96 146 Q113 140 130 142 Q147 140 164 146"
      stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
</svg>
